# All services use the host's network stack (network_mode: host). Docker's bridge network has no
# internet access when a VPN with a kill switch (e.g. Surfshark/WireGuard) is active, which broke
# both the Twilio API calls and the tunnels. The app therefore binds to 127.0.0.1 only, so it is
# still not reachable from the LAN; the tunnels connect to it on 127.0.0.1.
services:
  app:
    build: .
    image: llamadas-en-espanol:latest
    container_name: llamadas-en-espanol
    restart: unless-stopped
    # Secrets are read at runtime from server/.env (git-ignored, not baked into the image).
    env_file:
      - path: server/.env
        required: false
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: ${APP_PORT:-3001}
      # Filled in by ./start.sh --cloudflare with the quick tunnel's URL; empty otherwise.
      TUNNEL_PUBLIC_BASE_URL: ${TUNNEL_PUBLIC_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s

  # Optional HTTPS tunnels so Twilio can reach the webhooks (use one of them).

  # Cloudflare quick tunnel: no account needed, random https://*.trycloudflare.com URL on every start.
  # Enabled with:  ./start.sh --cloudflare
  # Not restarted automatically: a restart would change the URL. Run ./start.sh --cloudflare again instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: "no"
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:${APP_PORT:-3001}"]

  # ngrok with a fixed domain.
  # Enabled with:  ./start.sh --tunnel   (needs NGROK_AUTHTOKEN and NGROK_DOMAIN in server/.env)
  tunnel:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    depends_on: [app]
    restart: unless-stopped
    network_mode: host
    # Only the ngrok token is passed (not the Twilio secrets). start.sh exports these from server/.env.
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    # The custom config keeps the inspector on 127.0.0.1:4040 (the image default is 0.0.0.0).
    configs:
      - source: ngrok_config
        target: /etc/ngrok-local.yml
    command: ["http", "--config=/etc/ngrok-local.yml", "--url=${NGROK_DOMAIN:-}", "127.0.0.1:${APP_PORT:-3001}"]

configs:
  ngrok_config:
    content: |
      version: "2"
      web_addr: 127.0.0.1:4040
