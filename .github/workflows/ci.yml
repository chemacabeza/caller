name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  unit:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Uses an in-memory fake Twilio and fake credentials: no real calls, no secrets needed.
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (the build stage also runs the unit tests)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: llamadas-en-espanol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 3001:3001 -e APP_PASSWORD=ci llamadas-en-espanol:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3001/ | grep -q 'Llamadas en Español'
      - name: Container logs
        if: ${{ always() }}
        run: docker logs app || true
